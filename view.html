<!DOCTYPE html>
<html>
<head>

    <title>View Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <style>

body{
    background:#f5f5f5;
}

.carousel img{
    height:550px;
    object-fit:cover;
}

.card{
    border:none;
}

</style>

</head>

<body class="bg-light">

<div class="container mt-5">

    <div id="productDetails"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://lrvczyzarnpyqfgqjbdn.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxydmN6eXphcm5weXFmZ3FqYmRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzEzNzIsImV4cCI6MjA5MzE0NzM3Mn0.hqnXLyA6-Q6Mg9o7YsEWuUX6NO8YTHWXJHS2ysMRltk";

const supabaseClient =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

// GET PRODUCT ID
const params =
new URLSearchParams(window.location.search);

const productId =
params.get("id");

// LOAD PRODUCT
async function loadProduct() {

    const { data, error } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();

    if (error) {
        console.log(error);
        return;
    }

    const product =
    document.getElementById("productDetails");

    // CREATE CAROUSEL
    let carouselItems = "";

    data.images.forEach((img, index) => {

        carouselItems += `

        <div class="carousel-item ${index === 0 ? 'active' : ''}">

            <img
                src="${img}"
                class="d-block w-100"
                style="height:400px; object-fit:cover;"
            >

        </div>
        `;
    });

    product.innerHTML = `

<div class="row g-4">

    <!-- LEFT SIDE -->
    <div class="col-md-6">

        <div class="card shadow border-0 rounded-4 overflow-hidden">

            <div id="productCarousel"
            class="carousel slide"
            data-bs-ride="carousel">

                <div class="carousel-inner">

                    ${carouselItems}

                </div>

                <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#productCarousel"
                    data-bs-slide="prev"
                >
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#productCarousel"
                    data-bs-slide="next"
                >
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>

        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="col-md-6">

        <div class="card shadow border-0 rounded-4 h-100">

            <div class="card-body p-4 d-flex flex-column">

                <h2 class="fw-bold mb-3">
                    ${data.title}
                </h2>

                <h3 class="text-success fw-bold mb-4">
                    ₦${data.price}
                </h3>

                <div class="mb-3">

                    <h5>Description</h5>

                    <p class="text-muted">
                        ${data.description || "No description"}
                    </p>

                </div>

                <div class="mb-3">

                    <h6>
                        📍 Location:
                    </h6>

                    <p class="text-muted">
                        ${data.location || "Not specified"}
                    </p>

                </div>

                <div class="mb-3">

                    <h6>
                        📦 Condition:
                    </h6>

                    <p class="text-muted">
                        ${data.condition || "Not specified"}
                    </p>

                </div>

                <div class="mb-4">

                    <h6>
                        📱 Whatsapp:
                    </h6>

                    <p class="text-muted">
                        ${data.whatsapp_number || ""}
                    </p>

                </div>

                <div class="mt-auto d-grid gap-2">

                    <a
                        href="https://wa.me/${data.whatsapp_number}"
                        target="_blank"
                        class="btn btn-success btn-lg rounded-3"
                    >
                        Chat on WhatsApp
                    </a>

                    <a
                        href="dashboard.html"
                        class="btn btn-dark rounded-3"
                    >
                        Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>
`;
}
loadProduct();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
