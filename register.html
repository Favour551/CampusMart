<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMart - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

body{
    background:#f8f9fa;
}

.card{
    background:#0f172a;
    color:white;
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

</style>
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 380px; border-radius: 15px;">

        <h3 class="text-center fw-bold mb-1">CampusMart</h3>
        <p class="text-center text-light">Create your account</p>

        <form onsubmit="registerUser(event)">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" id="phone" class="form-control" placeholder="Enter phone number" required>
            </div>

            <div class="mb-3">
                <label class="form-label"> Create Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create password" required>
                <div class="form-check mb-3">
             <input type="checkbox" class="form-check-input" id="showPassword" onclick="togglePassword()">
             <label class="form-check-label">Show Password</label>
         </div>
            </div>


            <button class="btn btn-success w-100">Register</button>

        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p class="text-center mt-2">
            <a href="index.html" class="text-light small">← Back to Home</a>
        </p>

    </div>
</div>
<!-- SUPABASE SDK -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let supabaseClient; // only declare once

document.addEventListener("DOMContentLoaded", () => {

    const supabaseUrl = "https://lrvczyzarnpyqfgqjbdn.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxydmN6eXphcm5weXFmZ3FqYmRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzEzNzIsImV4cCI6MjA5MzE0NzM3Mn0.hqnXLyA6-Q6Mg9o7YsEWuUX6NO8YTHWXJHS2ysMRltk";

    supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    console.log("Supabase initialized");
});

async function registerUser(event) {
    event.preventDefault();

    if (!supabaseClient) {
        alert("Supabase not ready");
        return;
    }

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signUp({
        email,
        password
    });

    if (error) {
        alert(error.message);
        return;
    }
    const user = data.user;

const { error: dbError } = await supabaseClient
    .from("users")
    .insert([
        {
            id: user.id,
            name: name,
            email: email
        }
    ]);

if (dbError) {
    alert(dbError.message);
    return;
}


    alert("Registration successful! Please check your email and confirm your account before logging in.");
   window.location.href = "login.html";

}
</script>



<script>
function togglePassword() {
    let passwordInput = document.getElementById("password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}
</script>
</body>
</html>
