<!DOCTYPE html>
<html>
<head>
    <title>CampusMart - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="dashboard.html">CampusMart</a>

    <!-- <form class="d-flex" style="width: 40%;">
        <input class="form-control me-2" type="search" placeholder="Search products...">
        <button class="btn btn-outline-light">Search</button>
    </form> -->

    <div>
        <a href="post_ad.html" class="btn btn-success btn-sm">Post Ad</a>
        <a href="user-dashboard.html" class="btn btn-outline-light btn-sm">My Account</a>
        <a href="index.html" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- HEADER TEXT -->
<div class="container mt-4">
    <h3 id="welcomeText">Welcome to CampusMart 👋</h3>
    <p id="userEmail" class="text-muted">Buy and sell items within your campus easily</p>
</div>

<!-- PRODUCTS GRID -->
<div class="container mt-3">
    <div class="row g-3" id="adsContainer">

       


    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://lrvczyzarnpyqfgqjbdn.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxydmN6eXphcm5weXFmZ3FqYmRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzEzNzIsImV4cCI6MjA5MzE0NzM3Mn0.hqnXLyA6-Q6Mg9o7YsEWuUX6NO8YTHWXJHS2ysMRltk";

const supabaseClient =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);


// LOAD USER
async function loadUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (user) {

        document.getElementById("userEmail")
        .innerText = user.email;
    }
}

loadUser();


// LOAD PRODUCTS
async function loadProducts() {

    const { data, error } =
    await supabaseClient
        .from("products")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

        console.log(error);

        return;
    }

    const adsContainer =
    document.getElementById("adsContainer");

    adsContainer.innerHTML = "";

    data.forEach(product => {

        const image =
        product.images?.[0] ||
        "https://via.placeholder.com/300";

        adsContainer.innerHTML += `

        <div class="col-md-4">

            <div class="card shadow-sm h-100">

                <img
                    src="${image}"
                    class="card-img-top"
                    style="height:250px; object-fit:cover;"
                >

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title">
                        ${product.title}
                    </h5>

                    <h6 class="text-success fw-bold">
                        ₦${product.price}
                    </h6>

                    <p class="text-muted small">
                        ${product.location || ""}
                    </p>

                    <a
                        href="view.html?id=${product.id}"
                        class="btn btn-dark mt-auto"
                    >
                        View
                    </a>

                </div>

            </div>

        </div>
        `;
    });
}

loadProducts();

</script>
</body>
</html>
