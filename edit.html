<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Ad - CampusMart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .card{
            border:none;
            border-radius:20px;
        }

        .preview-img{
            width:100px;
            height:100px;
            object-fit:cover;
            border-radius:12px;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand" href="dashboard.html">
        CampusMart
    </a>

    <div class="d-flex gap-2">

        <a href="user-dashboard.html"
        class="btn btn-primary btn-sm">
            My Account
        </a>

        <a href="dashboard.html"
        class="btn btn-success btn-sm">
            Marketplace
        </a>

    </div>

</nav>



<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm p-4">

                <h2 class="fw-bold mb-4">
                    Edit Ad
                </h2>

                <form onsubmit="updateAd(event)">

                    <div class="mb-3">

                        <label class="form-label">
                            Product Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Price
                        </label>

                        <input
                            type="number"
                            id="price"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Whatsapp Number
                        </label>

                        <input
                            type="text"
                            id="number"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Condition
                        </label>

                        <select
                            id="condition"
                            class="form-select"
                        >

                            <option>New</option>
                            <option>Used</option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="4"
                        ></textarea>

                    </div>


                    <!-- CURRENT IMAGES -->
                    <div class="mb-3">

                        <label class="form-label">
                            Current Images
                        </label>

                        <div
                            id="currentImages"
                            class="d-flex gap-2 flex-wrap"
                        ></div>

                    </div>


                    <button
                        class="btn btn-dark w-100 py-2"
                    >
                        Update Ad
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://lrvczyzarnpyqfgqjbdn.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxydmN6eXphcm5weXFmZ3FqYmRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzEzNzIsImV4cCI6MjA5MzE0NzM3Mn0.hqnXLyA6-Q6Mg9o7YsEWuUX6NO8YTHWXJHS2ysMRltk";

const supabaseClient =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);


// GET PRODUCT ID
const params =
new URLSearchParams(window.location.search);

const productId =
params.get("id");


// LOAD PRODUCT
async function loadProduct() {

    const { data, error } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();

    if (error) {

        console.log(error);

        return;
    }

    // FILL FORM
    document.getElementById("title").value =
    data.title || "";

    document.getElementById("price").value =
    data.price || "";

    document.getElementById("number").value =
    data.whatsapp_number || "";

    document.getElementById("location").value =
    data.location || "";

    document.getElementById("condition").value =
    data.condition || "New";

    document.getElementById("description").value =
    data.description || "";


    // SHOW IMAGES
    const currentImages =
    document.getElementById("currentImages");

    currentImages.innerHTML = "";

    if (data.images && data.images.length > 0) {

        data.images.forEach(img => {

            currentImages.innerHTML += `

            <img
                src="${img}"
                class="preview-img shadow-sm"
            >
            `;
        });
    }
}


// UPDATE PRODUCT
async function updateAd(event) {

    event.preventDefault();

    const title =
    document.getElementById("title").value;

    const price =
    document.getElementById("price").value;

    const number =
    document.getElementById("number").value;

    const location =
    document.getElementById("location").value;

    const condition =
    document.getElementById("condition").value;

    const description =
    document.getElementById("description").value;


    const { error } =
    await supabaseClient
        .from("products")
        .update({

            title: title,
            price: price,
            whatsapp_number: number,
            location: location,
            condition: condition,
            description: description

        })
        .eq("id", productId);

    if (error) {

        alert(error.message);

        return;
    }

    alert("Ad updated successfully");

    window.location.href =
    "user-dashboard.html";
}


loadProduct();

</script>

</body>
</html>
