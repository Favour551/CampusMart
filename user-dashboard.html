<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - CampusMart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .card{
            border:none;
            border-radius:18px;
        }

        .listing-img{
            height:220px;
            object-fit:cover;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand" href="dashboard.html">
        CampusMart
    </a>

    <div class="d-flex gap-2">

        <a href="post_ad.html" class="btn btn-success btn-sm">
            Post Ad
        </a>

        <a href="dashboard.html" class="btn btn-primary btn-sm">
            Marketplace
        </a>
        <a href="report.html" class="btn btn-outline-danger text-light btn-sm">
            Report a Problem
        </a>

        <button onclick="logoutUser()" class="btn btn-danger btn-sm">
            Logout
        </button>

    </div>

</nav>


<!-- PAGE -->
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="container mt-4">
    <h3>My Dashboard 👤</h3>
    <p class="text-muted">Manage your listings and account</p>
</div>

    </div>


    <!-- TOTAL -->
    <div class="card shadow-sm p-4 mb-4">

        <h5 class="text-muted">
            Total Listings
        </h5>

        <h1
            class="fw-bold text-primary"
            id="totalListings"
        >
            0
        </h1>

    </div>


    <!-- MY LISTINGS -->
    <h3 class="fw-bold mb-3">
        My Listings
    </h3>

    <div class="row g-4" id="listingsContainer">

    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://lrvczyzarnpyqfgqjbdn.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxydmN6eXphcm5weXFmZ3FqYmRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzEzNzIsImV4cCI6MjA5MzE0NzM3Mn0.hqnXLyA6-Q6Mg9o7YsEWuUX6NO8YTHWXJHS2ysMRltk";

const supabaseClient =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);


// LOAD USER ADS
async function loadMyAds() {

    // CHECK USER
    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href = "login.html";

        return;
    }

    // FETCH PRODUCTS
    const { data, error } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("user_id", user.id)
        .order("id", { ascending: false });

    if (error) {

        console.log(error);

        return;
    }

    // TOTAL LISTINGS
    document.getElementById("totalListings")
    .innerText = data.length;

    const listingsContainer =
    document.getElementById("listingsContainer");

    listingsContainer.innerHTML = "";

    // EMPTY STATE
    if (data.length === 0) {

        listingsContainer.innerHTML = `

        <div class="col-12">

            <div class="alert alert-secondary text-center p-4 rounded-4">

                You have not posted any ads yet

            </div>

        </div>
        `;

        return;
    }

    // LOOP PRODUCTS
    data.forEach(product => {

        const image =
        product.images?.[0] ||
        "https://via.placeholder.com/300";

        listingsContainer.innerHTML += `

        <div class="col-md-4">

            <div class="card shadow-sm h-100 overflow-hidden">

                <img
                    src="${image}"
                    class="card-img-top listing-img"
                >

                <div class="card-body d-flex flex-column">

                    <h5 class="fw-bold">
                        ${product.title}
                    </h5>

                    <h4 class="text-success fw-bold">
                        ₦${product.price}
                    </h4>

                    <p class="text-muted small">
                        ${product.location || ""}
                    </p>

                    <div class="d-flex gap-2 mt-auto">

                        <a
                            href="view.html?id=${product.id}"
                            class="btn btn-primary flex-fill"
                        >
                            View
                        </a>

                        <a
                            href="edit.html?id=${product.id}"
                            class="btn btn-warning flex-fill"
                        >
                            Edit
                        </a>

                        <button
                            onclick="deleteAd(${product.id})"
                            class="btn btn-danger flex-fill"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            </div>

        </div>
        `;
    });
}


// DELETE PRODUCT
async function deleteAd(productId) {

    const confirmDelete =
    confirm("Delete this ad?");

    if (!confirmDelete) return;

    const { error } =
    await supabaseClient
        .from("products")
        .delete()
        .eq("id", productId);

    if (error) {

        alert(error.message);

        return;
    }

    alert("Ad deleted successfully");

    loadMyAds();
}


// LOGOUT
async function logoutUser() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
}


// LOAD PAGE
loadMyAds();

</script>

</body>
</html>
