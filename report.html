<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Report a Problem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .card{
            border:none;
            border-radius:20px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm p-4">

                <h2 class="fw-bold text-center mb-2">
                    Report a Problem
                </h2>

                <p class="text-muted text-center mb-4">
                    Tell us what issue you are facing
                </p>

                <form onsubmit="submitReport(event)">

                    <div class="mb-3">

                        <label class="form-label">
                            Describe the Problem
                        </label>

                        <textarea
                            id="message"
                            class="form-control"
                            rows="6"
                            required
                        ></textarea>

                    </div>

                    <button
                        class="btn btn-danger w-100 py-2"
                    >
                        Submit Report
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://lrvczyzarnpyqfgqjbdn.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxydmN6eXphcm5weXFmZ3FqYmRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzEzNzIsImV4cCI6MjA5MzE0NzM3Mn0.hqnXLyA6-Q6Mg9o7YsEWuUX6NO8YTHWXJHS2ysMRltk";

const supabaseClient =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);


// SUBMIT REPORT
async function submitReport(event) {

    event.preventDefault();

    // GET USER
    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href = "login.html";

        return;
    }

    const message =
    document.getElementById("message").value;

    // INSERT REPORT
    const { error } =
    await supabaseClient
        .from("reports")
        .insert([

            {
                user_id: user.id,
                user_email: user.email,
                message: message
            }

        ]);

    if (error) {

        alert(error.message);

        return;
    }

    alert("Report submitted successfully");

    window.location.href =
    "user-dashboard.html";
}

</script>

</body>
</html>
